# YUNG's Extras for Horizon — one flat SDK package (mod API 0.2).
#
# The mod is not a structure mod: it is eleven Java *feature types* that place a
# structure template at a feature's origin, plus one Java placement-modifier type
# (`yungsextras:rng_initializer`) that reseeds the placement random. The package
# therefore carries its 62 templates as content and places **one family** (the
# swamp arch) through the only template-placement surface the pin has — vanilla's
# `minecraft:template` configured feature — and records the eleven feature types
# and the placement modifier as `blocked(...)` (see notes.md).
#
# Licence: LGPL-3.0-only, read from the jar (`META-INF/neoforge.mods.toml` says
# `license="LGPLv3"`; the jar ships the LGPL-3.0 text as `LICENSE_YungsExtras`);
# rank 1, copyleft — publishable under the same licence with the complete
# corresponding source. `LICENSE` and `LICENSE-NOTICE.md` travel inside the
# package. Local-only until the maintainer approves publishing (ARCHITECTURE.md
# section 8).
id = "yungsextras"
name = "YUNG's Extras"
# The port's own version, not the original mod's 1.21.1-NeoForge-5.1.1: a
# resubmission is always a new version, and this is the first publication of the
# SDK package.
version = "0.2.0"
description = """YUNG's Extras' scattered decoration for Horizon: six swamp pieces (arches, double arches, pillars, cubbies, a church and an ogre) and five desert pieces (wells, obelisks, ruins, a giant torch and a chillzone), each a structure template placed by a feature. The pin has no surface for a mod to register a feature type, so the swamp arch family (11 templates) is carried as vanilla `minecraft:template` configured features with a data processor list that runs the mod's own marker-block processing, and the other ten families are carried as content only with their placement recorded as blocked: their feature types (`yungsextras:desert_well`, `yungsextras:swamp_cubby`, ...) and the mod's `yungsextras:rng_initializer` placement modifier cannot be named at 26.3. All 62 templates ship, so every piece can be placed by hand with `/place template`; only the arches generate in a swamp."""
authors = ["YUNGNICKYOUNG (upstream)", "Acarii (upstream)", "AdLf0208"]
# A native mod: Rust in src/, compiled by the launcher against the game build
# [native] pins, beside the carried data/. The id is the resource namespace and
# the only identity: Cargo's package name and version are not the mod's.
api = "0.2"
# The installation side, not the hook's: the content and the worldgen it feeds
# belong to the server, and an integrated server belongs to the client
# installation, so a single-player world or a LAN host needs both.
side = "both"
# The one shared value every manifest carries ("May add blocks, items, mob
# effects and entity types"). This mod registers nothing from code; the field is
# a schema requirement, not a claim.
capabilities = ["registries"]
license = "LGPL-3.0-only"
homepage = "https://github.com/yungnickyoung/YUNGs-Extras"
issues = "https://github.com/yungnickyoung/YUNGs-Extras/issues"

[native]
game = "26.3"
horizon = "0b14f8acfd97fa2c750e42795249dcc981178ca4"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
